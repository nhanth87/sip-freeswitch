# Quarkus profile=capacity-1m — cluster-scale SIP foundations.
# Does NOT claim 1M TPS or 10k INVITE/s. See docs/agents/capacity-1m.md
# Activate: QUARKUS_PROFILE=capacity-1m  (or capacity-1m,prod)
# Lab HD A–B calls stay on the default profile (ICE/TURN + PG CMP on).

sf.capacity.profile=cluster-1m
sf.cmp.pg-sync=false

microjainslee.container.sbb-pool-max=262144

# CPS bench: STUN/ICE off the SIP thread. Voice HD lab must not use this profile.
sip.ra.ice-enabled=false
sf.ims.feature.charging=false
sf.charging.dual-write=false
sf.cgrates.enabled=false
sf.rf.enabled=false
sf.ocs.session.enabled=false
