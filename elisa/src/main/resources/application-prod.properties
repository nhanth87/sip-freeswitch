# Quarkus profile=prod — activate: QUARKUS_PROFILE=prod or -Dquarkus.profile=prod
# Secrets have NO lab defaults — missing env fails closed at config resolve / bootstrap.

sf.admin.dev-login=false
sf.admin.api-key=${SF_ADMIN_API_KEY}
sf.admin.session-hmac-secret=${SF_ADMIN_SESSION_HMAC_SECRET}
sf.admin.bootstrap-password=${SF_ADMIN_BOOTSTRAP_PASSWORD}

# Charging off until operator enables (SessionS / Rf / dual-write)
sf.ims.feature.charging=false
sf.ims.feature.enum=false
sf.charging.dual-write=false
sf.cgrates.enabled=false
sf.cgrates.cdrs.enabled=false
sf.cgrates.sessions.enabled=false
sf.rf.enabled=false
sf.ocs.session.enabled=false
sf.ocs.mode=deferred

# Multi S-CSCF: DIST_SYNC required (LOCAL is single-node lab only)
sf.cluster.infinispan.enabled=true
sf.cluster.infinispan.mode=${SF_CLUSTER_ISPN_MODE:DIST_SYNC}
sf.cluster.infinispan.cluster-name=${SF_CLUSTER_ISPN_NAME:elisa-cluster}

microjainslee.container.sbb-pool-max=40960
# 1M SIP TPS is cluster-scale — docs/agents/capacity-1m.md (do not claim)
