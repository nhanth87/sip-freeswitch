# Quarkus admin HTTP (SIP traffic uses SIP RA on its own port)
quarkus.http.port=8088
quarkus.http.test-port=0
quarkus.application.name=elisa
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${SF_DB_USER:elisa}
quarkus.datasource.password=${SF_DB_PASSWORD:elisa}
quarkus.datasource.jdbc.url=${SF_JDBC_URL:jdbc:postgresql://localhost:5432/elisa}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=validate

# MicroSLEE container tuning
microjainslee.container.buffer-size=2048
microjainslee.container.prefer-virtual-threads=true
microjainslee.container.sbb-pool-min=16
microjainslee.container.sbb-pool-max=40960
microjainslee.container.sbb-per-virtual-thread=true
quarkus.config.mapping.validate-unknown=false

# SIP RA
sip.ra.host=0.0.0.0
sip.ra.udp-port=5060
sip.ra.tcp-port=5060
sip.ra.dns-enabled=true
sip.ra.dns-cache-ttl-secs=300
# ICE optional for lab phones; disable on pure CPS hot path if STUN adds latency
sip.ra.ice-enabled=${SIP_RA_ICE_ENABLED:true}
sip.ra.stun-server=${SIP_RA_STUN_SERVER:stun.l.google.com}
sip.ra.stun-port=${SIP_RA_STUN_PORT:3478}
sip.ra.ice-keep-alive-secs=30

# Media firewall path (rtp_redirect): ICE + TURN typ relay required; FS must not bypass_media
sf.media.rtp-redirect=${SF_MEDIA_RTP_REDIRECT:true}
sf.media.ice-required=${SF_MEDIA_ICE_REQUIRED:true}
sf.media.require-turn=${SF_MEDIA_REQUIRE_TURN:true}
sf.media.stun.uri=${SF_MEDIA_STUN_URI:stun:stun.l.google.com:3478}
sf.media.turn.uri=${SF_MEDIA_TURN_URI:turn:127.0.0.1:3478}
sf.media.turn.username=${SF_MEDIA_TURN_USERNAME:elisa}
sf.media.turn.credential=${SF_MEDIA_TURN_CREDENTIAL:elisaturn}

# Trunk toward FreeSWITCH lab
sip.trunk.freeswitch-uri=${SF_TRUNK_FREESWITCH_URI:sip:1000@127.0.0.1:5062}
sip.trunk.domain=freeswitch.lab

microjainslee.telemetry.enabled=true

# Elisa admin and FreeSWITCH Event Socket Layer
sf.admin.api-key=${SF_ADMIN_API_KEY:sf-admin}
sf.admin.session-hmac-secret=${SF_ADMIN_SESSION_HMAC_SECRET:change-me-sf}
sf.admin.bootstrap-password=${SF_ADMIN_BOOTSTRAP_PASSWORD:admin}
# Cluster C1/C3
sf.cluster.node-id=${SF_CLUSTER_NODE_ID:elisa-1}
sf.cluster.infinispan.enabled=${SF_CLUSTER_ISPN_ENABLED:true}
sf.cluster.infinispan.mode=${SF_CLUSTER_ISPN_MODE:LOCAL}
sf.cluster.infinispan.ttl-seconds=${SF_CLUSTER_ISPN_TTL:7200}
sf.cluster.infinispan.cluster-name=${SF_CLUSTER_ISPN_NAME:elisa-dialogs}
sf.esl.host=${SF_ESL_HOST:localhost}
sf.esl.port=${SF_ESL_PORT:8021}
sf.esl.password=${SF_ESL_PASSWORD:ClueCon}
sf.html-dir=${SF_HTML_DIR:}
sf.fs.conf-dir=${SF_FS_CONF_DIR:}
sf.fs.hard-restart-cmd=${SF_FS_HARD_RESTART_CMD:docker compose restart freeswitch}
sf.ivr.conf-export-enabled=${SF_IVR_CONF_EXPORT:true}
sf.ivr.conf-subdir=${SF_IVR_CONF_SUBDIR:dialplan/elisa-ivr}

# SIP ingress ACL — only approved CIDRs (sf_acl_entry list=sip-ingress action=allow)
sf.sip.acl.enabled=${SF_SIP_ACL_ENABLED:true}
sf.sip.acl.default-action=${SF_SIP_ACL_DEFAULT:deny}

# IMS Core roles (grill I2) — all true = combined lab node
sf.ims.enabled=${SF_IMS_ENABLED:true}
sf.ims.role.pcscf=${SF_IMS_PCSCF:true}
sf.ims.role.icscf=${SF_IMS_ICSCF:true}
sf.ims.role.scscf=${SF_IMS_SCSCF:true}
sf.ims.role.hss=${SF_IMS_HSS:true}
sf.ims.realm=${SF_IMS_REALM:ims.lab}
sf.ims.pcscf-uri=${SF_IMS_PCSCF_URI:sip:pcscf.ims.lab:5060}
sf.ims.icscf-uri=${SF_IMS_ICSCF_URI:sip:icscf.ims.lab:5060}
sf.ims.scscf-uri=${SF_IMS_SCSCF_URI:sip:scscf.ims.lab:5060}
sf.ims.isc.as-uri=${SF_IMS_ISC_AS:}
sf.ims.cx.enabled=${SF_IMS_CX_ENABLED:true}
sf.ims.cx.listen-host=${SF_IMS_CX_HOST:0.0.0.0}
sf.ims.cx.listen-port=${SF_IMS_CX_PORT:3868}
sf.ims.cx.origin-host=${SF_IMS_CX_ORIGIN:elisa.ims.lab}
sf.ims.cx.origin-realm=${SF_IMS_CX_REALM:ims.lab}
sf.ims.cx.destination-host=${SF_IMS_CX_DEST_HOST:hss.ims.lab}
sf.ims.cx.destination-realm=${SF_IMS_CX_DEST_REALM:ims.lab}

# Charging / CGRates (grill G1–G5) — offline dual-write; SessionS = Phase C
sf.cgrates.enabled=${SF_CGRATES_ENABLED:false}
sf.cgrates.url=${SF_CGRATES_URL:http://127.0.0.1:2080}
sf.cgrates.tenant=${SF_CGRATES_TENANT:cgrates.org}
sf.cgrates.cdrs.enabled=${SF_CGRATES_CDRS_ENABLED:false}
sf.cgrates.account-key=${SF_CGRATES_ACCOUNT_KEY:msisdn}
sf.cgrates.timeout-ms=${SF_CGRATES_TIMEOUT_MS:2000}
sf.charging.dual-write=${SF_CHARGING_DUAL_WRITE:false}
sf.rf.enabled=${SF_RF_ENABLED:false}
sf.ocs.mode=${SF_OCS_MODE:deferred}
sf.ocs.session.enabled=${SF_OCS_SESSION_ENABLED:false}
sf.ocs.pending.sweep-interval-sec=${SF_OCS_PENDING_SWEEP_SEC:30}
