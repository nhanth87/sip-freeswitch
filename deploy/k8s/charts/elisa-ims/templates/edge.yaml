{{- /*
nginx edge (locked ingress, docs/agents/nginx-ingress.md): SIP L4 VIP with hash $remote_addr affinity to the
S-CSCF pods, admin HTTP. Upstream names are re-resolved (`resolve`, nginx >= 1.27.3) — a restarted pod keeps
its DNS name, not its IP. RTP / TURN never cross nginx.
*/ -}}
{{- $ns := .Release.Namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-edge
  labels: {{- include "elisa.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /var/run/nginx.pid;
    events { worker_connections 16384; multi_accept on; }
    stream {
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
        upstream scscf_sip {
            zone scscf_sip 64k;
            hash $remote_addr consistent;
            {{- range $i, $_ := until (int .Values.scscf.replicas) }}
            server scscf-{{ $i }}.scscf-hl.{{ $ns }}.svc.cluster.local:5060 resolve;
            {{- end }}
        }
        server {
            listen 5060;
            proxy_pass scscf_sip;
            proxy_connect_timeout 5s;
            proxy_timeout 3600s;
        }
        server {
            listen 5060 udp reuseport;
            proxy_pass scscf_sip;
            proxy_responses 32;
            proxy_timeout 60s;
        }
    }
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
        access_log /dev/stdout;
        server {
            listen 8080;
            location /fs/ { deny all; return 403; }
            location / {
                set $elisa_http scscf-0.scscf-hl.{{ $ns }}.svc.cluster.local:8088;
                proxy_pass http://$elisa_http;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_read_timeout 120s;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-edge
  labels: {{- include "elisa.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-edge
        {{- include "elisa.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.scscf.replicas | toString | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.edge.image }}:{{ .Values.edge.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: sip-udp, containerPort: 5060, protocol: UDP}
            - {name: sip-tcp, containerPort: 5060, protocol: TCP}
            - {name: http, containerPort: 8080, protocol: TCP}
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
      volumes:
        - name: conf
          configMap:
            name: nginx-edge
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-edge
  labels: {{- include "elisa.labels" . | nindent 4 }}
spec:
  type: {{ .Values.edge.serviceType }}
  selector:
    app.kubernetes.io/name: nginx-edge
  ports:
    - {name: sip-udp, port: 5060, protocol: UDP}
    - {name: sip-tcp, port: 5060, protocol: TCP}
    - {name: http, port: 8080, protocol: TCP}
