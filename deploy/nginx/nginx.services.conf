# Split-service edge — SIP VIP → pcscf; admin → scscf (profiles/sessions SoT).
# Used by docker-compose.services.yml (nginx-services). RTP/TURN still bypass.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

stream {
    log_format sip_l4 '$remote_addr [$time_local] $protocol $status '
                      'bytes=$bytes_sent upstream=$upstream_addr';
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gm VIP → S-CSCF pool (combined P/I/S N–N nodes). Sticky by client IP:
    # normal calls MUST stay on the node that authenticated the UE's REGISTER
    # (the peer has no local auth context for a bare INVITE, so round-robin
    # breaks normal calls with 401). Open-source nginx stream has no active
    # health_check for UDP, so mid-call failover to the peer after this node
    # dies is a known N–N gap (peer dialog recovery is not a live prove).
    upstream pcscf_sip {
        hash $remote_addr consistent;
        server scscf:5060;
        server scscf-2:5060;
    }

    server {
        listen 5060;
        proxy_pass pcscf_sip;
        proxy_connect_timeout 5s;
        proxy_timeout 3600s;
        access_log off;
    }

    server {
        listen 5060 udp reuseport;
        proxy_pass pcscf_sip;
        # 0 = wait for none (SIPp blind). 1 = first answer only (REGISTER 401 OK, INVITE 200 eaten).
        proxy_responses 32;
        proxy_timeout 60s;
        access_log off;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'xff="$http_x_forwarded_for"';

    server {
        listen 8080;
        server_name _;
        access_log /var/log/nginx/http-8080.log main;

        location /fs/ {
            deny all;
            return 403;
        }

        # Admin / profiles / sessions live on S-CSCF (IMS SoT + CallSession)
        location / {
            set $elisa_http scscf:8088;
            proxy_pass http://$elisa_http;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
        }
    }

    server {
        listen 8443 ssl;
        server_name pcscf.ims.lab scscf.ims.lab elisa.ims.lab _;
        access_log /var/log/nginx/http-8443.log main;

        ssl_certificate     /etc/nginx/certs/elisa-edge.crt;
        ssl_certificate_key /etc/nginx/certs/elisa-edge.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        location /fs/ {
            deny all;
            return 403;
        }

        location / {
            set $elisa_http scscf:8088;
            proxy_pass http://$elisa_http;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
        }
    }
}
