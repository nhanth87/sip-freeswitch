# Elisa edge — N1–N8 (docs/agents/nginx-ingress.md)
# http → Elisa :8088 | stream SIP → Elisa :5060 | RTP/TURN bypass (not here)
# Upstream hostnames resolved at runtime via Docker DNS (127.0.0.11).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

# ── SIP VIP (L4 only — not a P-CSCF) ───────────────────────────────────────
stream {
    log_format sip_l4 '$remote_addr [$time_local] $protocol $status '
                      'bytes=$bytes_sent upstream=$upstream_addr';

    # Docker Compose embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Sticky by client IP (N5). Variable proxy_pass → runtime resolve (N1).
    # Multi-node: put a small TCP LB in front or add more stream servers later.
    server {
        listen 5060;
        set $elisa_sip elisa:5060;
        proxy_pass $elisa_sip;
        proxy_connect_timeout 5s;
        proxy_timeout 3600s;
        access_log off;
    }

    # Lab UDP — weaker affinity/NAT; prod prefer TCP/TLS
    server {
        listen 5060 udp reuseport;
        set $elisa_sip_udp elisa:5060;
        proxy_pass $elisa_sip_udp;
        proxy_responses 0;
        proxy_timeout 60s;
        access_log off;
    }
}

# ── Admin / APIs (HTTPS + cleartext lab :8080) ───────────────────────────────
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'xff="$http_x_forwarded_for"';

    # Lab cleartext (SIPp/admin without TLS hassle)
    server {
        listen 8080;
        server_name _;
        access_log /var/log/nginx/http-8080.log main;

        # xml_curl must stay Elisa-internal (FS → http://elisa:8088/fs/xml)
        location /fs/ {
            deny all;
            return 403;
        }

        location / {
            set $elisa_http elisa:8088;
            proxy_pass http://$elisa_http;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
        }
    }

    # TLS admin edge
    server {
        listen 8443 ssl;
        server_name pcscf.ims.lab elisa.ims.lab _;
        access_log /var/log/nginx/http-8443.log main;

        ssl_certificate     /etc/nginx/certs/elisa-edge.crt;
        ssl_certificate_key /etc/nginx/certs/elisa-edge.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        location /fs/ {
            deny all;
            return 403;
        }

        location / {
            set $elisa_http elisa:8088;
            proxy_pass http://$elisa_http;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
        }
    }
}
