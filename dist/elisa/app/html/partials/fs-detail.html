<div class="metrics">
  <div class="metric-card">
    <div class="label">ESL</div>
    <div class="value" style="font-size:1rem;margin-top:.5rem">
      <span class="badge {{ESL_BADGE_CLASS}}">{{ESL_LABEL}}</span>
      <span class="badge badge-line" style="margin-left:.35rem">ch {{CHANNELS}}</span>
    </div>
  </div>
  <div class="metric-card">
    <div class="label">Conf root</div>
    <div class="value mono" style="font-size:.75rem;word-break:break-all">{{CONF_ROOT}}</div>
  </div>
</div>
<details style="margin-top:1rem">
  <summary class="hint">version</summary>
  <pre class="mono" style="white-space:pre-wrap;max-height:8rem;overflow:auto">{{VERSION}}</pre>
</details>
<details>
  <summary class="hint">status</summary>
  <pre class="mono" style="white-space:pre-wrap;max-height:10rem;overflow:auto">{{STATUS}}</pre>
</details>
<details>
  <summary class="hint">modules (truncated)</summary>
  <pre class="mono" style="white-space:pre-wrap;max-height:10rem;overflow:auto">{{MODULES}}</pre>
</details>
