<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ELISA Tenants</title>
  <script>(function(){try{var t=localStorage.getItem('sf-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.setAttribute('data-theme','dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}})()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/admin/static/admin.css"/>
  <script src="/admin/static/htmx.min.js"></script>
  <script defer src="/admin/static/sf-shell.js"></script>
  <script defer src="/admin/static/alpine.min.js"></script>
  
</head>
<body class="sf-app" x-data="sfShell()">
<div class="sf-layout" :class="{'rail-collapsed': railCollapsed, 'rail-open': mobileOpen}">
  {{NAV_RAIL}}
  <div class="sf-content">
    <div class="sf-topbar">
      <div style="display:flex;gap:.75rem;align-items:center">
        <button type="button" class="btn btn-ghost" @click="toggleMobile()" aria-label="Menu">☰</button>
        <span class="hx-live-badge">HTMX</span>
      </div>
      <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">{{AUTH_NAV}}</div>
    </div>
    <main class="sf-main">

<p class="eyebrow">Admin</p>
<div class="ops-section-indent">
  <h1>Tenants &amp; trunks</h1>
  <p class="hint">LAB / ENTERPRISE / TRUNK (SIP·WS·HTTP2·HTTP3). OPS reseller owns created tenants.</p>
  <form class="panel" method="post" action="/admin/tenants" style="margin:1rem 0;display:grid;gap:.5rem;max-width:36rem" x-data="{kind:'LAB'}">
    <label>tenantId <input name="tenantId" class="mono" required placeholder="acme-1"/></label>
    <label>Display name <input name="name"/></label>
    <label>Kind
      <select name="kind" x-model="kind">
        <option>LAB</option><option>ENTERPRISE</option><option>TRUNK</option>
      </select>
    </label>
    <label>Source addr alias (CDR OA) <input name="sourceAddrAlias" class="mono" placeholder="ACME"/></label>
    <label>HTTP API key (blank = generate) <input name="httpApiKey" class="mono" autocomplete="off"/></label>
    <template x-if="kind==='TRUNK'">
      <div style="display:grid;gap:.5rem">
        <label>Trunk transport
          <select name="trunkTransport"><option>SIP</option><option>WS</option><option>HTTP2</option><option>HTTP3</option></select>
        </label>
        <label>Trunk config JSON <textarea name="trunkConfig" class="mono" rows="4">{}</textarea></label>
      </div>
    </template>
    <label><input type="checkbox" name="enabled" value="true" checked/> Enabled</label>
    <button class="btn btn-primary" type="submit">Save tenant</button>
  </form>
  <div class="table-wrap" hx-get="/admin/partial/tenant-rows" hx-trigger="load" hx-swap="innerHTML">Loading…</div>
</div>

    </main>
  </div>
</div>
</body>
</html>
