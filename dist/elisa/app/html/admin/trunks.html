<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ELISA SIP Trunks</title>
  <script>(function(){try{var t=localStorage.getItem('sf-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.setAttribute('data-theme','dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}})()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/admin/static/admin.css"/>
  <script src="/admin/static/htmx.min.js"></script>
  <script defer src="/admin/static/sf-shell.js"></script>
  <script defer src="/admin/static/alpine.min.js"></script>
</head>
<body class="sf-app" x-data="sfShell()">
<div class="sf-layout" :class="{'rail-collapsed': railCollapsed, 'rail-open': mobileOpen}">
  {{NAV_RAIL}}
  <div class="sf-content">
    <div class="sf-topbar">
      <div style="display:flex;gap:.75rem;align-items:center">
        <button type="button" class="btn btn-ghost" @click="toggleMobile()" aria-label="Menu">☰</button>
        <span class="hx-live-badge">HTMX</span>
      </div>
      <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">{{AUTH_NAV}}</div>
    </div>
    <main class="sf-main">
<p class="eyebrow">IMS Core</p>
<div class="ops-section-indent">
  <h1>SIP trunks (ISC / MRF / PSTN)</h1>
  <p class="hint">Postgres <code>sf_sip_trunk</code> — shared across N–N S-CSCF. Pick primary ISC/MRF by priority.
    Props <code>sip.trunk.freeswitch-uri</code> is fallback when table empty. Listen alone ≠ peer UP.</p>
  <form class="panel" method="post" action="/admin/trunks" style="margin:1rem 0;display:grid;gap:.5rem;max-width:36rem">
    <label>Id <input name="id" class="mono" required placeholder="fs-default"/></label>
    <label>Name <input name="name" placeholder="FreeSWITCH lab"/></label>
    <label>Peer host <input name="peerHost" class="mono" required placeholder="127.0.0.1"/></label>
    <label>Peer port <input name="peerPort" class="mono" value="5062"/></label>
    <label>Transport
      <select name="transport"><option>UDP</option><option>TCP</option><option>TLS</option></select>
    </label>
    <label>SIP URI <input name="sipUri" class="mono" required placeholder="sip:1000@127.0.0.1:5062"/></label>
    <label>Kind
      <select name="kind"><option>ISC</option><option>MRF</option><option>PSTN</option></select>
    </label>
    <label>Priority <input name="priority" class="mono" value="10"/></label>
    <label>Tenant id <input name="tenantId" class="mono" placeholder="(shared)"/></label>
    <label><input type="checkbox" name="enabled" value="true" checked/> Enabled</label>
    <button class="btn btn-primary" type="submit">Save trunk</button>
  </form>
  <div class="table-wrap" hx-get="/admin/partial/trunk-rows" hx-trigger="load" hx-swap="innerHTML">Loading…</div>
</div>
    </main>
  </div>
</div>
</body>
</html>
