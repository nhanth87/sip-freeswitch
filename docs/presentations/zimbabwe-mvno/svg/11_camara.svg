<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0.0" width="1280" height="3.9" fill="#009B48"/>
<rect x="0" y="3.4" width="1280" height="3.9" fill="#FCE300"/>
<rect x="0" y="6.9" width="1280" height="3.9" fill="#DE2010"/>
<rect x="0" y="10.3" width="1280" height="3.9" fill="#000000"/>
<rect x="0" y="13.7" width="1280" height="3.9" fill="#DE2010"/>
<rect x="0" y="17.1" width="1280" height="3.9" fill="#FCE300"/>
<rect x="0" y="20.6" width="1280" height="3.9" fill="#009B48"/>
  <text x="80" y="100" font-family="Georgia, serif" font-size="36" fill="#0B1F14" font-weight="700">CAMARA Silent Authentication</text>
  <text x="80" y="145" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2A4A35">
    Replace OTA-heavy SMS OTP flows with network-native, SIM-grade identity
  </text>
  <!-- Old -->
  <rect x="80" y="200" width="500" height="400" rx="18" fill="#F5E8E8" stroke="#DE2010" stroke-width="3"/>
  <text x="330" y="250" text-anchor="middle" font-size="24" fill="#DE2010" font-family="Georgia, serif">Legacy OTA / OTP</text>
  <text x="120" y="310" font-size="16" fill="#0B1F14" font-family="Helvetica, Arial, sans-serif">• SMS delivery risk (SS7)</text>
  <text x="120" y="350" font-size="16" fill="#0B1F14" font-family="Helvetica, Arial, sans-serif">• SIM toolkit / OTA complexity</text>
  <text x="120" y="390" font-size="16" fill="#0B1F14" font-family="Helvetica, Arial, sans-serif">• High fraud &amp; cost per auth</text>
  <text x="120" y="430" font-size="16" fill="#0B1F14" font-family="Helvetica, Arial, sans-serif">• Poor UX (wait for code)</text>
  <!-- New -->
  <rect x="700" y="200" width="500" height="400" rx="18" fill="#E8F7EE" stroke="#009B48" stroke-width="3"/>
  <text x="950" y="250" text-anchor="middle" font-size="24" fill="#009B48" font-family="Georgia, serif">CAMARA SA</text>
  <text x="740" y="310" font-size="16" fill="#0B1F14" font-family="Helvetica, Arial, sans-serif">• Network / SIM-based proof</text>
  <text x="740" y="350" font-size="16" fill="#0B1F14" font-family="Helvetica, Arial, sans-serif">• GSMA Open Gateway APIs</text>
  <text x="740" y="390" font-size="16" fill="#0B1F14" font-family="Helvetica, Arial, sans-serif">• Banks &amp; fintech pay per verify</text>
  <text x="740" y="430" font-size="16" fill="#0B1F14" font-family="Helvetica, Arial, sans-serif">• Instant UX · lower fraud</text>
  <polygon points="620,400 680,380 680,420" fill="#FCE300"/>
</svg>
