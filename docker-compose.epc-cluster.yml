# Two-node SGW-C on epc-cluster (DIST_SYNC) for the failover test (docs/agents/epc-sgw-pgw-wire.md):
#   docker compose -f docker-compose.yml -f docker-compose.services.yml -f docker-compose.epc-wire.yml \
#     -f docker-compose.epc-cluster.yml --profile epc up -d epc-sgwc-2
# Create Session on epc-sgwc (.14); kill it; Modify / Release / Delete go to epc-sgwc-2 (.24), which answers
# from the shared session store (epc-sessions + Postgres) and claims the departed node's sessions.
x-java: &java
  JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true -Xms64m -Xmx512m -XX:+UseSerialGC -Dlog4j2.configurationFile=/etc/volte/log4j2.xml"

services:
  epc-sgwc-2:
    profiles: ["epc"]
    image: sip-freeswitch-epc-sgwc
    env_file: [./deploy/epc/roles/sgwc.env]
    networks:
      sf-net:
        ipv4_address: 172.20.10.24
    volumes:
      - ./deploy/volte/log4j2.xml:/etc/volte/log4j2.xml:ro
    environment:
      <<: *java
      EPC_JDBC_URL: jdbc:postgresql://postgres-epc:5432/epc
      EPC_CLUSTER_NODE_ID: epc-sgwc-2
      EPC_CLUSTER_NODE_INDEX: "3"
      EPC_GTP_PEER_HOST: 172.20.0.1
      EPC_GTP_PEER_PORT: "2123"
      EPC_S5C_WIRE: "true"
      EPC_S5C_PGWC_PEER_HOST: 172.20.10.13
      EPC_S5C_PGWC_PEER_PORT: "2123"
      EPC_PFCP_PEER_HOST: 172.20.10.16
      EPC_SGWU_PEER_HOST: 172.20.10.16
    depends_on:
      postgres-epc:
        condition: service_healthy
