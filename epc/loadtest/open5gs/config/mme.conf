# freeDiameter config for the open5gs MME (S6a Diameter CLIENT to our epc-hss).
# Identity/Realm are what our HSS sees as the MME peer (Origin-Host in CEA),
# and MUST match hss.env EPC_DIAMETER_DEST_HOST / EPC_DIAMETER_DEST_REALM.
Identity = "mme.epc.lab";
Realm = "epc.lab";

# S6a listener (the HSS dials mme:3868 as its client role; Open5GS also dials out below).
Port = 3868;
ListenOn = "0.0.0.0";

# Lab certs (CN=mme.epc.lab, generated in config/tls/) — freeDiameter requires
# creds whose subject matches Identity; our S6a link itself stays No_TLS below.
TLS_Cred = "/etc/open5gs/tls-lab/mme.crt", "/etc/open5gs/tls-lab/mme.key";
TLS_CA = "/etc/open5gs/tls-lab/ca.crt";

LoadExtension = "/usr/lib/x86_64-linux-gnu/freeDiameter/dbg_msg_dumps.fdx" : "0x8888";
LoadExtension = "/usr/lib/x86_64-linux-gnu/freeDiameter/dict_rfc5777.fdx";
LoadExtension = "/usr/lib/x86_64-linux-gnu/freeDiameter/dict_mip6i.fdx";
LoadExtension = "/usr/lib/x86_64-linux-gnu/freeDiameter/dict_nasreq.fdx";
LoadExtension = "/usr/lib/x86_64-linux-gnu/freeDiameter/dict_nas_mipv6.fdx";
LoadExtension = "/usr/lib/x86_64-linux-gnu/freeDiameter/dict_dcca.fdx";
LoadExtension = "/usr/lib/x86_64-linux-gnu/freeDiameter/dict_dcca_3gpp.fdx";

# S6a peer = our external HSS. Identity MUST match the CEA Origin-Host the HSS advertises.
# epc-hss resolves to the epc-hss container on sf-net; identity = epc-hss-1.epc.lab.
ConnectPeer = "epc-hss-1.epc.lab" { ConnectTo = "epc-hss"; No_TLS; Port = 3868; Prefer_TCP; };