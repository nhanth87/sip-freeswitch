quarkus.http.port=${EPC_HTTP_PORT:8099}
quarkus.http.host=0.0.0.0
epc.role.hss=${EPC_ROLE_HSS:true}
epc.role.sgwc=${EPC_ROLE_SGWC:true}
epc.role.pgwc=${EPC_ROLE_PGWC:true}
# P1 pcrf/pcef/up default OFF — a legacy 3-flag env (hss.env/sgwc.env/pgwc.env)
# must NOT silently wire Gx/Rx or a user-plane role it did not ask for.
epc.role.pcrf=${EPC_ROLE_PCRF:false}
epc.role.pcef=${EPC_ROLE_PCEF:false}
epc.role.up=${EPC_ROLE_UP:false}
epc.cluster.node-id=${EPC_CLUSTER_NODE_ID:epc-1}
epc.cluster.mode=${EPC_CLUSTER_ISPN_MODE:LOCAL}
epc.cluster.name=${EPC_CLUSTER_ISPN_NAME:epc-cluster}
epc.cluster.node-index=${EPC_CLUSTER_NODE_INDEX:1}
epc.gtp.peer.host=${EPC_GTP_PEER_HOST:127.0.0.1}
epc.gtp.peer.port=${EPC_GTP_PEER_PORT:2123}
epc.pfcp.peer.host=${EPC_PFCP_PEER_HOST:127.0.0.1}
epc.pfcp.peer.port=${EPC_PFCP_PEER_PORT:8805}
# Dedicated DB — never the Elisa database.
epc.jdbc.url=${EPC_JDBC_URL:jdbc:postgresql://postgres-epc:5432/epc}

# Outbound Diameter peer seam (S6a→MME / Cx→Elisa / Gx→AF / Gy→OCS). Blank peer
# host keeps listen-only 0.0.0.0:3868 for the heap/lab path; set it to initiate
# CER. peerReady == CEA accepted — never "socket bound".
epc.diameter.peer.host=${EPC_DIAMETER_PEER_HOST:}
epc.diameter.peer.port=${EPC_DIAMETER_PEER_PORT:3868}
epc.diameter.peer.role=${EPC_DIAMETER_PEER_ROLE:client}
epc.diameter.destination.host=${EPC_DIAMETER_DEST_HOST:}
epc.diameter.destination.realm=${EPC_DIAMETER_DEST_REALM:}
epc.diameter.origin.host=${EPC_DIAMETER_ORIGIN_HOST:}
epc.diameter.origin.realm=${EPC_DIAMETER_ORIGIN_REALM:epc.lab}
# Several Diameter peers, one link each: host:port:role:destHost:destRealm:app+app;...
# (HSS: MME S6a + I/S-CSCF Cx; PCRF: PGW-C Gx + P-CSCF Rx). Overrides the single peer above.
epc.diameter.peers=${EPC_DIAMETER_PEERS:}
# S-CSCF a Cx UAR hands out for a subscriber not yet served by one.
epc.hss.scscf-uri=${EPC_HSS_SCSCF_URI:sip:scscf.ims.lab:5060}

# Datastore wiring knob: true -> Postgres (Agroal named "epc") + Flyway + Infinispan
# in the control plane; false -> pure heap (tests / single-node lab without PG).
epc.datastore.enabled=${EPC_DATASTORE_ENABLED:true}
# HSS/AuC secret key-encryption-key (32 hex chars = 16 bytes). Production overrides
# with an HSM-held key; the dev default keeps boot deterministic.
epc.hss.secret.kek-hex=${EPC_KEK_HEX:000102030405060708090a0b0c0d0e0f}
# MME peer-trust drawbridge (Open5GS #4337): only Origin-Host/Realm or Visited-PLMN
# matching the comma list below may ULR/AIR. Empty+enabled = fail-closed (deny all).
epc.hss.mme.allowlist=${EPC_HSS_MME_ALLOWLIST:}
epc.hss.mme.allowlist.enabled=${EPC_HSS_MME_ALLOWLIST_ENABLED:false}

# Named Web/Agroal datasource "epc" — Postgres on the dedicated epc DB only.
# Never opens the (unnamed) default datasource / Elisa DB.
quarkus.datasource.epc.db-kind=postgresql
quarkus.datasource.epc.jdbc.url=${EPC_JDBC_URL:jdbc:postgresql://postgres-epc:5432/epc}
quarkus.datasource.epc.jdbc.driver=org.postgresql.Driver
quarkus.datasource.epc.username=${EPC_DB_USERNAME:epc}
quarkus.datasource.epc.password=${EPC_DB_PASSWORD:epc}
# Named datasource must be active or Quarkus won't synthesize the @DataSource("epc") bean.
quarkus.datasource.epc.active=true

# Flyway on the "epc" datasource: migrate at start only when the datastore is on,
# so the disabled path never opens a DB connection.
quarkus.flyway.epc.migrate-at-start=${EPC_DATASTORE_ENABLED:true}

# Infinispan control-plane cluster (epc-cluster — never elisa-cluster).
epc.cluster.enabled=${EPC_ISPN_ENABLED:true}
epc.cluster.ttl-seconds=${EPC_ISPN_TTL_SECONDS:7200}
# ── P1 knobs surfaced on /epc/config for dashboard parity (read-only observability).
# Neutral defaults preserve lab in-process behavior; per-role values are set in the
# deploy/epc/roles/*.env files (hss/sgwc/pgwc/pcef/up-linux) + compose environment.
epc.s5c.wire=${EPC_S5C_WIRE:false}
epc.s5c.pgwc.peer.host=${EPC_S5C_PGWC_PEER_HOST:127.0.0.1}
epc.s5c.pgwc.peer.port=${EPC_S5C_PGWC_PEER_PORT:2123}
# W3-b PCO (TS 23.401): P-CSCF/DNS handed to the UE on the IMS APN —
# D2: advertise the Gm VIP (never a bare node IP). Empty = container omitted.
epc.pco.pcscf-ipv4=${EPC_PCO_PCSCF_IPV4:172.31.255.10}
epc.pco.dns-ipv4=${EPC_PCO_DNS_IPV4:}
epc.up.qer.enabled=${EPC_UP_QER_ENABLED:false}
epc.up.urr.mode=${EPC_UP_URR_MODE:poll}
epc.up.urr.poll-ms=${EPC_UP_URR_POLL_MS:60000}
epc.up.urr.baseline.persist-ms=${EPC_UP_URR_BASELINE_PERSIST_MS:300000}
epc.pcef.ocs.enabled=${EPC_PCEF_OCS_ENABLED:false}

# ── Admin dashboard parity (read-only observability): SGW-U/PGW-U anchors are
# distinct from the generic PFCP heartbeat peer, and AMBR/PDN-pool are the
# pilot defaults mirrored onto /epc/config.
epc.sgwu.peer.host=${EPC_SGWU_PEER_HOST:127.0.0.1}
epc.sgwu.peer.port=${EPC_SGWU_PEER_PORT:8805}
epc.pgwu.peer.host=${EPC_PGWU_PEER_HOST:127.0.0.1}
epc.pgwu.peer.port=${EPC_PGWU_PEER_PORT:8805}
epc.ambr.apn.ul-bps=${EPC_AMBR_APN_UL_BPS:1000000000}
epc.ambr.apn.dl-bps=${EPC_AMBR_APN_DL_BPS:1000000000}
epc.ambr.ue.ul-bps=${EPC_AMBR_UE_UL_BPS:1000000000}
epc.ambr.ue.dl-bps=${EPC_AMBR_UE_DL_BPS:1000000000}
epc.pdn.pool.ipv4=${EPC_PDN_POOL_IPV4:10.64.0.0/16}
epc.pdn.pool.ipv6=${EPC_PDN_POOL_IPV6:2001:db8::/64}
