<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ELISA User profiles</title>
  <script>(function(){try{var t=localStorage.getItem('sf-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.setAttribute('data-theme','dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}})()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/admin/static/admin.css"/>
  <script src="/admin/static/htmx.min.js"></script>
  <script defer src="/admin/static/sf-shell.js"></script>
  <script defer src="/admin/static/alpine.min.js"></script>
</head>
<body class="sf-app" x-data="sfShell()">
<div class="sf-layout" :class="{'rail-collapsed': railCollapsed, 'rail-open': mobileOpen}">
  {{NAV_RAIL}}
  <div class="sf-content">
    <div class="sf-topbar">
      <div style="display:flex;gap:.75rem;align-items:center">
        <button type="button" class="btn btn-ghost" @click="toggleMobile()" aria-label="Menu">☰</button>
        <span class="hx-live-badge">HTMX</span>
      </div>
      <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">{{AUTH_NAV}}</div>
    </div>
    <main class="sf-main">
<p class="eyebrow">User profile</p>
<div class="ops-section-indent">
  <h1>Telephony profiles (IMS-first)</h1>
  <p class="hint">MSISDN + IMPI/IMPU SoT. Sofia directory derives from these rows (<code>fs_a1_hash</code>). AKA Ki/OPc separate from FS digest.</p>
  <form class="panel" method="post" action="/admin/profiles" style="margin:1rem 0;display:grid;gap:.5rem;max-width:36rem">
    <label>Tenant id <input name="tenantId" class="mono" placeholder="lab-1"/></label>
    <label>MSISDN <input name="msisdn" class="mono" placeholder="2519…"/></label>
    <label>Display name <input name="displayName"/></label>
    <label>IMPI <input name="impi" class="mono" required placeholder="user@ims.lab"/></label>
    <label>IMPU <input name="impu" class="mono" required placeholder="sip:user@ims.lab"/></label>
    <label>Ki (hex) <input name="ki" class="mono" placeholder="001122…"/></label>
    <label>OPc (hex) <input name="opc" class="mono"/></label>
    <label>AMF <input name="amf" class="mono" value="8000"/></label>
    <label>FS a1-hash <input name="fsA1Hash" class="mono" placeholder="MD5(user:realm:pass)"/></label>
    <label>iFC JSON <textarea name="ifcJson" class="mono" rows="2">{"as":"mrf"}</textarea></label>
    <button class="btn btn-primary" type="submit">Save profile</button>
  </form>
  <div class="table-wrap" hx-get="/admin/partial/profile-rows" hx-trigger="load" hx-swap="innerHTML">Loading…</div>
</div>
    </main>
  </div>
</div>
</body>
</html>
