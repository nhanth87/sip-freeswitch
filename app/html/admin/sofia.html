<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem('sf-theme')||'dark'}catch(_){}})()</script>
  <title>Elisa Sofia</title>
  <link rel="stylesheet" href="/admin/static/admin.css"/>
  <script src="/admin/static/htmx.min.js"></script>
  <script defer src="/admin/static/alpine.min.js"></script>
  <script defer src="/admin/static/sf-shell.js"></script>
</head>
<body x-data>
<header><b class="signal">ELISA</b> {{NAV_LINKS}} {{AUTH_NAV}}</header>
<main>
  <h1>Sofia / FreeSWITCH plane</h1>
  <p class="hint">Live truth from ESL — never invent UP.</p>
  <div class="ops">
    <button type="button" @click="Alpine.store('sf').postJson('/admin/apply', '')">Apply reloadxml</button>
    <button type="button" @click="Alpine.store('sf').postJson('/admin/start', '')">Start external</button>
    <button type="button" @click="Alpine.store('sf').postJson('/admin/stop', '')">Stop external</button>
  </div>
  <section hx-get="/admin/links/fs" hx-trigger="load, every 5s">Loading FS status…</section>
</main>
</body>
</html>
