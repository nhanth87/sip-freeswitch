<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem('sf-theme')||'dark'}catch(_){}})()</script>
  <title>Elisa ESL</title>
  <link rel="stylesheet" href="/admin/static/admin.css"/>
  <script src="/admin/static/htmx.min.js"></script>
  <script defer src="/admin/static/alpine.min.js"></script>
  <script defer src="/admin/static/sf-shell.js"></script>
</head>
<body x-data>
<header><b class="signal">ELISA</b> {{NAV_LINKS}} {{AUTH_NAV}}</header>
<main>
  <h1>ESL Console (ADMIN)</h1>
  <form hx-post="/admin/esl" hx-target="#esl-out" hx-swap="innerHTML">
    <label>api command <input name="command" class="mono" placeholder="sofia status" style="width:100%"/></label>
    <button type="submit">Send</button>
  </form>
  <div id="esl-out" class="mono"></div>
</main>
</body>
</html>
