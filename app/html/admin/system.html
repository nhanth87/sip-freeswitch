<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ELISA System</title>
  <script>(function(){try{var t=localStorage.getItem('sf-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.setAttribute('data-theme','dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}})()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/admin/static/admin.css"/>
  <script src="/admin/static/htmx.min.js"></script>
  <script defer src="/admin/static/sf-shell.js"></script>
  <script defer src="/admin/static/alpine.min.js"></script>
  
</head>
<body class="sf-app" x-data="sfShell()">
<div class="sf-layout" :class="{{'rail-collapsed': railCollapsed, 'rail-open': mobileOpen}}">
  {{NAV_RAIL}}
  <div class="sf-content">
    <div class="sf-topbar">
      <div style="display:flex;gap:.75rem;align-items:center">
        <button type="button" class="btn btn-ghost" @click="toggleMobile()" aria-label="Menu">☰</button>
        <span class="hx-live-badge">HTMX</span>
      </div>
      <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">{{AUTH_NAV}}</div>
    </div>
    <main class="sf-main">

<p class="eyebrow">Admin</p><div class="ops-section-indent"><h1>System</h1>
<p class="hint">Apply / sofia start-stop (G12). FS conf edits → <a href="/admin/fs-control">FS Control</a>.</p>
<div class="panel" style="margin-top:1rem" x-data="{out:''}">
  <div style="display:flex;flex-wrap:wrap;gap:.5rem">
    <button type="button" class="btn btn-primary" @click="const r=await $store.sf.postJson('/admin/apply',''); out=(r.data&&r.data.message)||r.raw; $store.sf.toast(r.ok?'Applied':'Failed', r.ok?'ok':'error')">Apply reloadxml</button>
    <button type="button" class="btn btn-line" @click="const r=await $store.sf.postJson('/admin/start',''); out=(r.data&&r.data.message)||r.raw">Sofia start</button>
    <button type="button" class="btn btn-danger" @click="const r=await $store.sf.postJson('/admin/stop',''); out=(r.data&&r.data.message)||r.raw">Sofia stop</button>
  </div>
  <pre class="mono" style="margin-top:.75rem;white-space:pre-wrap" x-text="out"></pre>
</div></div>
    </main>
  </div>
</div>
</body>
</html>
