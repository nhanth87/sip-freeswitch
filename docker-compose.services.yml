# Overlay: one elisa image, deploy by IMS service (+ N–N S/FS pairs).
# FreeSWITCH is essential: scscf depends_on freeswitch; scscf-2 depends_on freeswitch-2 (1:1).
# Soft-fail ESL when FS down ≠ permission to omit FS from compose.
#
# Lab all-in-one (unchanged):
#   ./tools/build-all.sh && docker compose up -d --build
#
# Split services (scale down combined elisa + default nginx):
#   docker compose -f docker-compose.yml -f docker-compose.services.yml \
#     --profile services up -d --build --scale elisa=0 --scale nginx=0
#
# N–N second S-CSCF + FS pair (shared PG + coturn; VIP → P-CSCF):
#   docker compose -f docker-compose.yml -f docker-compose.services.yml \
#     --profile services --profile nn up -d --build --scale elisa=0 --scale nginx=0
#
# Pairing (C2/C3): scscf ESL→freeswitch, scscf-2 ESL→freeswitch-2; same SF_CLUSTER_ISPN_NAME.

x-elisa-db: &elisa-db
  SF_JDBC_URL: jdbc:postgresql://postgres:5432/elisa
  SF_DB_USER: elisa
  SF_DB_PASSWORD: elisa
  SF_HTML_DIR: /html
  SF_ADMIN_DEV_LOGIN: "true"
  # Docker + Netty: 0.0.0.0 must be IPv4 or nginx Gm VIP hits a silent IPv6-only :5060
  JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
  # Packaged Quarkus defaults to profile=prod — lab secrets required (fail-closed otherwise)
  SF_ADMIN_API_KEY: sf-admin
  SF_ADMIN_SESSION_HMAC_SECRET: change-me-sf-lab
  SF_ADMIN_BOOTSTRAP_PASSWORD: admin
  SF_FS_CONF_DIR: /html
  # Empty ${VAR:} interpolations fail SmallRye; unused URI is not a product BGCF
  SF_IMS_BGCF_URI: sip:unused-bgcf.lab:5060

x-elisa-media: &elisa-media
  SF_MEDIA_RTP_REDIRECT: "true"
  SF_MEDIA_REQUIRE_TURN: "true"
  SF_MEDIA_ICE_REQUIRED: "true"
  SF_MEDIA_TURN_URI: turn:coturn:3478
  SF_MEDIA_TURN_USERNAME: elisa
  SF_MEDIA_TURN_CREDENTIAL: elisaturn
  SF_MEDIA_STUN_URI: stun:coturn:3478
  SIP_RA_ICE_ENABLED: "true"
  SIP_RA_STUN_SERVER: coturn
  SIP_RA_STUN_PORT: "3478"

x-elisa-esl: &elisa-esl
  SF_ESL_PORT: "8021"
  SF_ESL_PASSWORD: ClueCon

services:
  # Remap FS-1 xml_curl → scscf (combined elisa is scaled to 0 in split mode)
  freeswitch:
    volumes:
      - ./freeswitch/conf/autoload_configs/event_socket.conf.xml:/etc/freeswitch/autoload_configs/event_socket.conf.xml:ro
      - ./freeswitch/conf/autoload_configs/acl.conf.xml:/etc/freeswitch/autoload_configs/acl.conf.xml:ro
      - ./freeswitch/conf/autoload_configs/xml_curl.scscf.conf.xml:/etc/freeswitch/autoload_configs/xml_curl.conf.xml:ro
      - ./freeswitch/conf/sip_profiles/external.xml:/etc/freeswitch/sip_profiles/external.xml:ro

  pcscf:
    profiles: ["services"]
    build: ./elisa
    env_file: [./deploy/elisa/roles/pcscf.env]
    environment:
      <<: [*elisa-db, *elisa-media]
      SF_CLUSTER_NODE_ID: elisa-pcscf-1
      SF_CLUSTER_ISPN_MODE: LOCAL
      SF_IMS_ISC_AS: sip:unused-isc.lab:5060
    volumes: [./app/html:/html:ro]
    expose: ["8088", "5060"]
    depends_on:
      postgres:
        condition: service_healthy
      coturn:
        condition: service_started
    networks: [sf-net]

  icscf:
    profiles: ["services"]
    build: ./elisa
    env_file: [./deploy/elisa/roles/icscf.env]
    environment:
      <<: *elisa-db
      SF_CLUSTER_NODE_ID: elisa-icscf-1
      SF_CLUSTER_ISPN_MODE: LOCAL
      SF_IMS_ISC_AS: sip:unused-isc.lab:5060
      SF_IMS_CX_PEER_HOST: hss
      SF_IMS_CX_PEER_PORT: "3868"
      SF_IMS_CX_ORIGIN: icscf.ims.lab
      SF_IMS_CX_DEST_HOST: hss.ims.lab
    volumes: [./app/html:/html:ro]
    expose: ["8088", "5060"]
    depends_on:
      postgres:
        condition: service_healthy
      hss:
        condition: service_started
    networks: [sf-net]

  scscf:
    profiles: ["services"]
    build: ./elisa
    env_file: [./deploy/elisa/roles/scscf.env]
    environment:
      <<: [*elisa-db, *elisa-media, *elisa-esl]
      SF_ESL_HOST: freeswitch
      SF_TRUNK_FREESWITCH_URI: sip:1000@freeswitch:5060
      SF_CLUSTER_NODE_ID: elisa-scscf-1
      SF_CLUSTER_ISPN_MODE: DIST_SYNC
      SF_CLUSTER_ISPN_NAME: elisa-cluster
      SF_IMS_ISC_AS: sip:1000@freeswitch:5060
      SF_IMS_HSS: "true"
    volumes: [./app/html:/html:ro]
    expose: ["8088", "5060"]
    depends_on:
      postgres:
        condition: service_healthy
      freeswitch:
        condition: service_started
      hss:
        condition: service_started
      coturn:
        condition: service_started
    networks: [sf-net]

  scscf-2:
    profiles: ["services", "nn"]
    build: ./elisa
    env_file: [./deploy/elisa/roles/scscf.env]
    environment:
      <<: [*elisa-db, *elisa-media, *elisa-esl]
      SF_ESL_HOST: freeswitch-2
      SF_TRUNK_FREESWITCH_URI: sip:1000@freeswitch-2:5060
      SF_CLUSTER_NODE_ID: elisa-scscf-2
      SF_CLUSTER_ISPN_MODE: DIST_SYNC
      SF_CLUSTER_ISPN_NAME: elisa-cluster
      SF_IMS_SCSCF_URI: sip:scscf-2:5060
      SF_IMS_ISC_AS: sip:1000@freeswitch-2:5060
      SF_IMS_HSS: "true"
    volumes: [./app/html:/html:ro]
    expose: ["8088", "5060"]
    depends_on:
      postgres:
        condition: service_healthy
      freeswitch-2:
        condition: service_started
      hss:
        condition: service_started
      coturn:
        condition: service_started
    networks: [sf-net]

  freeswitch-2:
    profiles: ["services", "nn"]
    image: safarov/freeswitch:latest
    depends_on:
      coturn:
        condition: service_started
    volumes:
      - ./freeswitch/conf/autoload_configs/event_socket.conf.xml:/etc/freeswitch/autoload_configs/event_socket.conf.xml:ro
      - ./freeswitch/conf/autoload_configs/acl.conf.xml:/etc/freeswitch/autoload_configs/acl.conf.xml:ro
      - ./freeswitch/conf/autoload_configs/xml_curl.scscf-2.conf.xml:/etc/freeswitch/autoload_configs/xml_curl.conf.xml:ro
      - ./freeswitch/conf/sip_profiles/external.xml:/etc/freeswitch/sip_profiles/external.xml:ro
    # ESL/SIP on sf-net only (no host port clash with freeswitch). RTP via Docker net + coturn.
    expose: ["5060", "8021"]
    healthcheck:
      test: ["CMD-SHELL", "fs_cli -x status 2>/dev/null | grep -q UP || (command -v nc >/dev/null && nc -z 127.0.0.1 8021)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [sf-net]

  hss:
    profiles: ["services"]
    build: ./elisa
    env_file: [./deploy/elisa/roles/hss.env]
    environment:
      <<: *elisa-db
      SF_CLUSTER_NODE_ID: elisa-hss-1
      SF_CLUSTER_ISPN_MODE: LOCAL
      SF_IMS_ISC_AS: sip:unused-isc.lab:5060
    volumes: [./app/html:/html:ro]
    expose: ["8088", "3868"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [sf-net]

  nginx-services:
    profiles: ["services"]
    build: ./deploy/nginx
    volumes:
      - ./deploy/nginx/nginx.services.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
      - "8443:8443"
      - "5060:5060/tcp"
      - "5060:5060/udp"
    depends_on:
      pcscf:
        condition: service_started
      icscf:
        condition: service_started
      scscf:
        condition: service_started
      freeswitch:
        condition: service_started
      hss:
        condition: service_started
    networks: [sf-net]

  # Optional CGRates sidecar (grill G4). Without profile, set sf.cgrates.url to an external OCS.
  #   docker compose -f docker-compose.yml -f docker-compose.services.yml --profile cgrates up -d cgrates
  # Then: SF_CGRATES_URL=http://cgrates:2080 SF_CGRATES_ENABLED=true SF_CGRATES_CDRS_ENABLED=true SF_CHARGING_DUAL_WRITE=true
  cgrates:
    profiles: ["cgrates"]
    image: cgrates/cgrates:latest
    command: ["cgr-engine", "-config_path", "/etc/cgrates"]
    ports:
      - "2080:2080"
    networks: [sf-net]

  # ── EPC plane (profile epc). Dedicated postgres-epc — never the Elisa DB.
  # One epc-host image × roles. SGW-C 1:1 SGW-U via PFCP (same idea as S-CSCF↔FS).
  #   docker compose -f docker-compose.yml -f docker-compose.services.yml --profile epc up -d
  postgres-epc:
    profiles: ["epc"]
    image: postgres:16
    environment:
      POSTGRES_DB: epc
      POSTGRES_USER: epc
      POSTGRES_PASSWORD: epc
    volumes: [epc-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epc -d epc"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [sf-net]

  epc-hss:
    profiles: ["epc"]
    build:
      context: ./epc
      dockerfile: epc-host/Dockerfile
    env_file: [./deploy/epc/roles/hss.env]
    environment:
      EPC_JDBC_URL: jdbc:postgresql://postgres-epc:5432/epc
      # P1 MME peer-trust drawbridge (Open5GS #4337); neutral off default.
      EPC_HSS_MME_ALLOWLIST_ENABLED: "false"
      EPC_HSS_MME_ALLOWLIST: ""
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    expose: ["8099", "3868"]
    depends_on:
      postgres-epc:
        condition: service_healthy
    networks: [sf-net]

  epc-sgwc:
    profiles: ["epc"]
    build:
      context: ./epc
      dockerfile: epc-host/Dockerfile
    env_file: [./deploy/epc/roles/sgwc.env]
    environment:
      EPC_JDBC_URL: jdbc:postgresql://postgres-epc:5432/epc
      # P1 split S5-C wire (SGW-C -> PGW-C GTPv2-C). Off = lab in-process.
      EPC_S5C_WIRE: "false"
      EPC_S5C_PGWC_PEER_HOST: "epc-pgwc"
      EPC_S5C_PGWC_PEER_PORT: "2123"
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    expose: ["8099", "2123"]
    depends_on:
      postgres-epc:
        condition: service_healthy
      sgwu:
        condition: service_started
    networks: [sf-net]

  epc-pgwc:
    profiles: ["epc"]
    build:
      context: ./epc
      dockerfile: epc-host/Dockerfile
    env_file: [./deploy/epc/roles/pgwc.env]
    environment:
      EPC_JDBC_URL: jdbc:postgresql://postgres-epc:5432/epc
      # P1 split S5-C listener side (PGW-C). Off = lab in-process.
      EPC_S5C_WIRE: "false"
      EPC_S5C_PGWC_PEER_HOST: "epc-sgwc"
      EPC_S5C_PGWC_PEER_PORT: "2123"
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    expose: ["8099", "2123"]
    depends_on:
      postgres-epc:
        condition: service_healthy
      pgwu:
        condition: service_started
    networks: [sf-net]

  sgwu:
    profiles: ["epc"]
    image: alpine:3.20
    command: ["sh", "-c", "echo sgwu linux-gtp placeholder — kernel GTP, not Java; sleep infinity"]
    expose: ["8805", "2152"]
    networks: [sf-net]

  pgwu:
    profiles: ["epc"]
    image: alpine:3.20
    command: ["sh", "-c", "echo pgwu linux-gtp placeholder — kernel GTP, not Java; sleep infinity"]
    expose: ["8805", "2152"]
    networks: [sf-net]

  epc-sgwc-2:
    profiles: ["epc"]
    build:
      context: ./epc
      dockerfile: epc-host/Dockerfile
    env_file: [./deploy/epc/roles/sgwc-2.env]
    environment:
      EPC_JDBC_URL: jdbc:postgresql://postgres-epc:5432/epc
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    expose: ["8099", "2123"]
    depends_on:
      postgres-epc:
        condition: service_healthy
      sgwu-2:
        condition: service_started
    networks: [sf-net]

  sgwu-2:
    profiles: ["epc"]
    image: alpine:3.20
    command: ["sh", "-c", "echo sgwu-2 linux-gtp placeholder; sleep infinity"]
    expose: ["8805", "2152"]
    networks: [sf-net]

  epc-pcrf:
    profiles: ["epc"]
    build:
      context: ./epc
      dockerfile: epc-host/Dockerfile
    env_file: [./deploy/epc/roles/pcrf.env]
    environment:
      EPC_JDBC_URL: jdbc:postgresql://postgres-epc:5432/epc
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    expose: ["8099", "3868"]
    depends_on:
      postgres-epc:
        condition: service_healthy
    networks: [sf-net]

  epc-pcef:
    profiles: ["epc"]
    build:
      context: ./epc
      dockerfile: epc-host/Dockerfile
    env_file: [./deploy/epc/roles/pcef.env]
    environment:
      EPC_JDBC_URL: jdbc:postgresql://postgres-epc:5432/epc
      # P1 online charging to OCS over Gy; off = CDR offline only.
      EPC_PCEF_OCS_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    expose: ["8099", "3868"]
    depends_on:
      postgres-epc:
        condition: service_healthy
    networks: [sf-net]

  epc-up-linux:
    profiles: ["epc"]
    build:
      context: ./epc
      dockerfile: epc-host/Dockerfile
    env_file: [./deploy/epc/roles/up-linux.env]
    environment:
      EPC_JDBC_URL: jdbc:postgresql://postgres-epc:5432/epc
      # P1 UP dataplane (GTP-U QER/URR); neutral defaults.
      EPC_UP_QER_ENABLED: "false"
      EPC_UP_URR_MODE: "poll"
      EPC_UP_URR_POLL_MS: "60000"
      EPC_UP_URR_BASELINE_PERSIST_MS: "300000"
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    # up role = control-plane see-through (no Diameter/GTP-C/PFCP RA on this node).
    # Kernel GTP-U is out of band; this host image is the UP peer-evidence node.
    expose: ["8099"]
    depends_on:
      postgres-epc:
        condition: service_healthy
    networks: [sf-net]

  # ── open5gs MME — the S6a CLIENT + S11 CLIENT that actually attach-against our EPC.
  # Built from the in-tree open5gs source (loadtest/ims-tools/open5gs) as a standalone
  # control-plane daemon (open5gs-mmed). No MongoDB needed — subscriber auth vectors are
  # served by our epc-hss over S6a; `mme` resolves on sf-net for hss.env
  # (EPC_DIAMETER_PEER_HOST=mme) and sgwc.env (EPC_GTP_PEER_HOST=mme).
  #   docker compose -f docker-compose.yml -f docker-compose.services.yml --profile epc up -d --build mme
  mme:
    profiles: ["epc"]
    image: local/open5gs-mme:epc
    build:
      context: .
      dockerfile: epc/loadtest/open5gs/Dockerfile
    command: ["open5gs-mmed", "-c", "/etc/open5gs/mme.yaml"]
    volumes:
      - ./epc/loadtest/open5gs/config/mme.yaml:/etc/open5gs/mme.yaml:ro
      - ./epc/loadtest/open5gs/config/mme.conf:/etc/freeDiameter/mme.conf:ro
      - ./epc/loadtest/open5gs/config/tls:/etc/open5gs/tls-lab:ro
    expose: ["3868", "2123/udp", "36412/sctp"]
    depends_on:
      epc-hss:
        condition: service_started
      epc-sgwc:
        condition: service_started
    networks: [sf-net]

  # ── Wire evidence capture sidecar (profile epc). tshark with NET_ADMIN/NET_RAW
  # inside sf-net — proves S6a/S11/PFCP on the wire WITHOUT host sudo. One-shot:
  #   docker compose -f docker-compose.yml -f docker-compose.services.yml --profile epc \
  #     run --rm -T pcap tshark -i eth0 -f 'port 3868 or udp port 2123 or udp port 8805' \
  #     -a duration:60 -w /pcaps/epc-wire.pcap
  pcap:
    profiles: ["epc"]
    image: nicolaka/netshoot:latest
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["./epc/loadtest/pcaps:/pcaps"]
    networks: [sf-net]
    entrypoint: []
    command: ["sh", "-c", "sleep infinity"]

  # ── OPTIONAL real open5gs user plane (SGWD/PGWD replaces the alpine placeholders above).
  # Keep OFF by default: these live under profile "epc-up", so `--profile epc` still boots
  # the alpine `sgwu`/`pgwu` placeholders unchanged. Enable only when you need real
  # PFCP Sxa/Sxb + userspace GTP-U (S1-U/S5-U/SGi) against mme. They use the same
  # local/open5gs-mme:epc image (build once), but need /dev/net/tun + NET_ADMIN +
  # ogstun setup (see loadtest/ims-tools/open5gs/docker/build/setup.sh) and a pgwu
  # with the PGW-C F-TEID; not required for the S6a/S11 control-plane smoke in the README.
  # mme-sgwu:
  #   profiles: ["epc-up"]
  #   image: local/open5gs-mme:epc
  #   command: ["open5gs-sgwud", "-c", "/etc/open5gs/sgwu.yaml"]
  #   cap_add: [NET_ADMIN]
  #   devices: ["/dev/net/tun:/dev/net/tun"]
  #   expose: ["8805/udp", "2152/udp"]
  #   networks: [sf-net]
  # mme-pgwu:
  #   profiles: ["epc-up"]
  #   image: local/open5gs-mme:epc
  #   command: ["open5gs-pgwud", "-c", "/etc/open5gs/pgwu.yaml"]
  #   cap_add: [NET_ADMIN]
  #   devices: ["/dev/net/tun:/dev/net/tun"]
  #   expose: ["8805/udp", "2152/udp"]
  #   networks: [sf-net]

volumes:
  epc-postgres: {}
